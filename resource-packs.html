<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ресурс паки - Ultra Cosmic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="space-bg"></canvas>

    <header class="site-header">
        <nav>
            <a href="index.html">Главная</a>
            <a href="projects.html">Проекты</a>
            <a href="resource-packs.html" class="active">Ресурс паки</a>
        </nav>
    </header>

    <main class="container" style="padding-top: 120px;">
        <h1 style="text-align: left;">Ресурс <span style="color: #00f3ff; text-shadow: 0 0 20px #00f3ff;">Паки</span></h1>
        <p style="color: #94a3b8; margin-bottom: 20px; font-size: 1.1rem;">
            Включи безумие. Выбирай эффекты, и сайт начнет ломать законы физики. Эффекты сохраняются и действуют на всех страницах!
        </p>
        
        <div class="packs-grid">
            
            <label class="effect-toggle">
                <span>Отравление (Poison)</span>
                <div class="switch">
                    <input type="checkbox" class="effect-checkbox" value="poison">
                    <span class="slider"></span>
                </div>
            </label>

            <label class="effect-toggle">
                <span>Тошнота (Nausea)</span>
                <div class="switch">
                    <input type="checkbox" class="effect-checkbox" value="nausea">
                    <span class="slider"></span>
                </div>
            </label>

            <label class="effect-toggle">
                <span>Ускорение (Speed)</span>
                <div class="switch">
                    <input type="checkbox" class="effect-checkbox" value="speed">
                    <span class="slider"></span>
                </div>
            </label>

            <label class="effect-toggle">
                <span>Замедление (Slowness)</span>
                <div class="switch">
                    <input type="checkbox" class="effect-checkbox" value="slowness">
                    <span class="slider"></span>
                </div>
            </label>

            <label class="effect-toggle">
                <span>Слепота (Blindness)</span>
                <div class="switch">
                    <input type="checkbox" class="effect-checkbox" value="blindness">
                    <span class="slider"></span>
                </div>
            </label>

            <label class="effect-toggle">
                <span>Прыгучесть (Jump Boost)</span>
                <div class="switch">
                    <input type="checkbox" class="effect-checkbox" value="jump">
                    <span class="slider"></span>
                </div>
            </label>

            <label class="effect-toggle">
                <span>Невесомость (Levitation)</span>
                <div class="switch">
                    <input type="checkbox" class="effect-checkbox" value="levitation">
                    <span class="slider"></span>
                </div>
            </label>

            <label class="effect-toggle">
                <span>Ночное зрение (Night Vision)</span>
                <div class="switch">
                    <input type="checkbox" class="effect-checkbox" value="night_vision">
                    <span class="slider"></span>
                </div>
            </label>

            <label class="effect-toggle">
                <span>Сопротивление (Resistance)</span>
                <div class="switch">
                    <input type="checkbox" class="effect-checkbox" value="resistance">
                    <span class="slider"></span>
                </div>
            </label>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
